[package]
name = "unitech"
description = "Unitech — ton bureau est une galaxie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows (cargo#8519).
name = "unitech_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
unitech-core.workspace = true
unitech-launcher.workspace = true
unitech-system.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[lints]
workspace = true
