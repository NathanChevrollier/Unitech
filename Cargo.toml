[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = ["Nathan Chevrollier"]
publish = false

[workspace.dependencies]
unitech-core = { path = "crates/unitech-core" }
unitech-launcher = { path = "crates/unitech-launcher" }
unitech-system = { path = "crates/unitech-system" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
base64 = "0.22"
dirs = "6"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
